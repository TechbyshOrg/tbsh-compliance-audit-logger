name: Create Release Zip

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare release folder
        run: |
          mkdir -p tbsh-compliance-audit-logger
          rsync -av ./ tbsh-compliance-audit-logger/ \
            --exclude='tbsh-compliance-audit-logger' \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.github' \
            --exclude='.distignore' \
            --exclude='.wordpress-org' \
            --exclude='scratch' \
            --exclude='docs' \
            --exclude='SEO-CONTENT-PLAN.txt' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='exports' \
            --exclude='tbsh-compliance-audit-logger_*.zip'

      - name: Create zip file
        run: |
          TAG_NAME=${GITHUB_REF##*/}
          ZIP_NAME="tbsh-compliance-audit-logger_${TAG_NAME}.zip"
          zip -r "$ZIP_NAME" tbsh-compliance-audit-logger
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          # Test tags such as 2.0.0-rc1 are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
